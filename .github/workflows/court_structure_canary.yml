name: 법원 사이트 구조 정기점검

on:
  workflow_dispatch:
    inputs:
      case_set:
        description: '검증 사건 범위'
        type: choice
        options:
          - first_10
          - remaining_9
        default: first_10
        required: true
  schedule:
    # 매일 한국시간 오전 7시. 업무 시작 전 구조 변경을 먼저 찾는다.
    - cron: '0 22 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: court-structure-canary
  cancel-in-progress: false

env:
  COURT_PYTHON: court-search/.runtime-venv/bin/python
  EASYOCR_MODEL_DIR: court-search/.easyocr-model
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome

jobs:
  canary:
    name: 통신·화면·API 구조 점검
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 고속 조회환경 불러오기
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            court-search/.runtime-venv
            court-search/.easyocr-model
          key: court-search-runtime-v3-cpu-ubuntu-24.04-${{ hashFiles('court-search/requirements.txt') }}

      - name: 캐시 없을 때 조회환경 준비
        if: ${{ steps.runtime-cache.outputs.cache-hit != 'true' }}
        run: |
          python3 -m venv court-search/.runtime-venv
          "$COURT_PYTHON" -m pip install --upgrade pip
          "$COURT_PYTHON" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$COURT_PYTHON" -m pip install -r court-search/requirements.txt
          "$COURT_PYTHON" - <<'PY'
          import easyocr
          easyocr.Reader(
              ['en'], gpu=False, verbose=False,
              model_storage_directory='court-search/.easyocr-model',
          )
          PY

      - name: 점검환경 확인
        run: |
          test -x "$COURT_PYTHON"
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$COURT_PYTHON" -c "import easyocr, openpyxl, playwright; print('구조 점검환경 준비 완료')"

      - name: 누적 캡차 모델 불러오기
        uses: actions/cache/restore@v4
        with:
          path: court-search/captcha-model
          key: court-captcha-v2-${{ github.run_id }}
          restore-keys: |
            court-captcha-v2-

      - name: 검증 사건 준비
        env:
          CASE_SET: ${{ inputs.case_set || 'first_10' }}
        run: |
          mkdir -p court-search/health
          "$COURT_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path
          import openpyxl

          source = Path('court-search/test_input_user_cases.xlsx')
          workbook = openpyxl.load_workbook(source, data_only=True, read_only=True)
          sheet = workbook.active
          headers = {
              str(cell.value).strip(): cell.column - 1
              for cell in sheet[1]
              if cell.value is not None
          }
          required = {'법원', '사건번호', '당사자명'}
          if not required.issubset(headers):
              raise SystemExit('테스트 사건 파일의 필수 열이 없습니다.')

          cases = []
          for row in sheet.iter_rows(min_row=2, values_only=True):
              court = row[headers['법원']] if headers['법원'] < len(row) else None
              case_no = row[headers['사건번호']] if headers['사건번호'] < len(row) else None
              party = row[headers['당사자명']] if headers['당사자명'] < len(row) else None
              if not court and not case_no:
                  continue
              if not court or not case_no:
                  raise SystemExit('테스트 사건에 법원 또는 사건번호가 비어 있습니다.')
              cases.append({
                  'court': str(court).strip(),
                  'case_no': str(case_no).strip(),
                  'party': str(party).strip() if party is not None else '',
              })

          if len(cases) < 10:
              raise SystemExit(f'테스트 사건 10건이 필요합니다. 현재 {len(cases)}건입니다.')
          if cases[0]['case_no'] != '2026타인3944':
              raise SystemExit('기준 검증 사건이 테스트 파일 첫 행에 없습니다.')
          case_set = os.getenv('CASE_SET', 'first_10')
          if case_set == 'remaining_9':
              cases = cases[1:10]
          elif case_set == 'first_10':
              cases = cases[:10]
          else:
              raise SystemExit(f'허용되지 않은 검증 범위: {case_set}')

          Path('court-search/health/canary-input.json').write_text(
              json.dumps({'cases': cases}, ensure_ascii=False),
              encoding='utf-8',
          )
          print(f'검증 사건 준비 완료: {len(cases)}건 (동시 조회 1건)') 
          PY

      - name: 통신·화면 구조 진단
        id: diagnosis
        continue-on-error: true
        run: >-
          "$COURT_PYTHON" -u court-search/connection_probe.py
          --timeout 12
          --attempts 3
          --retry-delay 5
          --browser-timeout 30
          --artifacts-dir court-search/health/debug/connection
          --output court-search/health/connection.json

      - name: API·결과 구조 검증
        id: lookup
        if: ${{ steps.diagnosis.outcome == 'success' }}
        continue-on-error: true
        env:
          COURT_WORKERS: '1'
          OCR_TORCH_THREADS: '2'
          COURT_REUSE_SESSION: 'true'
          CAPTCHA_FAST_PATH: 'false'
          COURT_IMMEDIATE_RETRY: 'false'
          COURT_DIRECT_API: 'true'
          COURT_TRACE_NETWORK: 'false'
          CAPTCHA_DATA_DIR: court-search/health/captcha-success
          CAPTCHA_SEED_DIR: court-search/captcha-model
          DEBUG_DIR: court-search/health/debug
          DEBUG_TABLES: '0'
        run: >-
          "$COURT_PYTHON" -u court-search/search.py
          court-search/health/canary-input.json
          court-search/health/canary-result.json

      - name: 구조 점검 보고서 생성
        if: always()
        env:
          DIAGNOSIS_OUTCOME: ${{ steps.diagnosis.outcome }}
          LOOKUP_OUTCOME: ${{ steps.lookup.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: '"$COURT_PYTHON" -u court-search/health_report.py'

      - name: 구조 점검자료 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-structure-health
          path: |
            court-search/health/health-report.json
            court-search/health/connection.json
            court-search/health/debug/connection
          if-no-files-found: error
          retention-days: 30

      - name: 점검 결과 확정
        if: always()
        run: |
          "$COURT_PYTHON" - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('court-search/health/health-report.json').read_text(encoding='utf-8'))
          if report['status'] != 'healthy':
              raise SystemExit('❌ ' + report['message'] + ' (' + report['classification'] + ')')
          print('✅ 법원 사이트 통신·화면·API 구조 점검 정상')
          PY
