name: 법원 점검기 회귀검증

on:
  pull_request:
    paths:
      - 'court-search/**'
      - '.github/workflows/court_structure_canary.yml'
      - '.github/workflows/court_monitor_tests.yml'
  push:
    branches: [main, 'fix/court-canary-*']
    paths:
      - 'court-search/**'
      - '.github/workflows/court_structure_canary.yml'
      - '.github/workflows/court_monitor_tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.49.0 openpyxl==3.1.5 Pillow==11.0.0 numpy==2.1.3
      # 모의 응답과 로컬 HTTP 서버만 사용하며 실제 사건검색은 실행하지 않는다.
      - run: python -m unittest discover -s court-search -p 'test_*.py' -v
