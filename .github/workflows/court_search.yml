name: 대법원 사건검색 자동조회

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: '조회 입력 파일'
        type: choice
        options:
          - input.xlsx
          - test_input.xlsx
        default: input.xlsx
        required: true
      prepare_only:
        description: '입력 점검만 실행 (검색 미제출)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: court-search/requirements.txt

      - name: 의존성 설치
        run: |
          pip install --break-system-packages -r court-search/requirements.txt
          playwright install chromium --with-deps

      - name: 입력 파일 확인
        env:
          INPUT_FILE: ${{ inputs.input_file }}
        run: |
          case "$INPUT_FILE" in
            input.xlsx|test_input.xlsx) ;;
            *) echo "허용되지 않은 입력 파일"; exit 1 ;;
          esac
          if [ ! -f "court-search/$INPUT_FILE" ]; then
            echo "❌ 입력 파일 없음: $INPUT_FILE"
            exit 1
          fi
          echo "✅ 입력 파일 확인: $INPUT_FILE"

      - name: 사건검색 실행
        env:
          INPUT_FILE: ${{ inputs.input_file }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          cd court-search
          args=("$INPUT_FILE" output.xlsx)
          if [ "$PREPARE_ONLY" = "true" ]; then args+=(--prepare-only); fi
          python search.py "${args[@]}"

      - name: 결과 파일 생성 확인
        run: |
          python - <<'PY'
          import openpyxl
          from pathlib import Path
          path = Path("court-search/output.xlsx")
          if not path.exists():
              raise SystemExit("❌ output.xlsx 없음")
          wb = openpyxl.load_workbook(path, read_only=True, data_only=True)
          print(f"✅ 결과 파일 생성: {wb.active.max_row - 1}건")
          PY

      - name: 완료 요약
        if: always()
        run: |
          if [ -f "court-search/output.xlsx" ]; then
            ls -lh court-search/output.xlsx
          else
            echo "output.xlsx 없음"
          fi
