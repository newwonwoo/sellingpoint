name: 대법원 사건검색 자동조회

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: '조회 입력 파일'
        type: choice
        options:
          - input.xlsx
          - test_input.xlsx
          - sample_input.xlsx
          - test_input_single.xlsx
          - test_input_user_cases.xlsx
        default: test_input.xlsx
        required: true
      prepare_only:
        description: '입력 점검만 실행 (검색 미제출)'
        type: boolean
        required: false
        default: true
      captcha_seed_run_id:
        description: '기존 실행의 통과 캡차를 최초 모델로 가져올 run ID (선택)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: 조회 묶음 준비
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      chunk_count: ${{ steps.plan.outputs.chunk_count }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 입력 파일 확인
        env:
          INPUT_FILE: ${{ inputs.input_file }}
        run: |
          case "$INPUT_FILE" in
            input.xlsx|test_input.xlsx|sample_input.xlsx|test_input_single.xlsx|test_input_user_cases.xlsx) ;;
            *) echo "허용되지 않은 입력 파일"; exit 1 ;;
          esac
          test -f "court-search/$INPUT_FILE"
          pip install openpyxl==3.1.5

      - name: 20건 단위 작업 계획
        id: plan
        env:
          INPUT_FILE: ${{ inputs.input_file }}
        run: python court-search/chunk_workbook.py matrix "court-search/$INPUT_FILE" >> "$GITHUB_OUTPUT"

  search:
    name: 사건 ${{ matrix.start }}-${{ matrix.end }} 조회
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: court-search/requirements.txt

      - name: 의존성 설치
        env:
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          if [ "$PREPARE_ONLY" = "true" ]; then
            pip install playwright==1.49.0 openpyxl==3.1.5 Pillow==11.0.0 numpy==2.1.3
          else
            pip install -r court-search/requirements.txt
          fi
          playwright install chromium --with-deps

      - name: 누적 캡차 모델 불러오기
        uses: actions/cache/restore@v4
        with:
          path: court-search/captcha-model
          key: court-captcha-v2-${{ github.run_id }}
          restore-keys: |
            court-captcha-v2-

      - name: ${{ matrix.start }}-${{ matrix.end }}번 입력 준비
        env:
          INPUT_FILE: ${{ inputs.input_file }}
          RANGE_START: ${{ matrix.start }}
          RANGE_END: ${{ matrix.end }}
        run: >-
          python court-search/chunk_workbook.py slice
          "court-search/$INPUT_FILE" court-search/chunk-input.xlsx
          "$RANGE_START" "$RANGE_END"

      - name: ${{ matrix.start }}-${{ matrix.end }}번 사건검색
        env:
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          COURT_WORKERS: ${{ matrix.workers }}
          OCR_TORCH_THREADS: '2'
          CAPTCHA_DATA_DIR: captcha-success
          CAPTCHA_SEED_DIR: captcha-model
          DEBUG_DIR: debug
          DEBUG_TABLES: '1'
        run: |
          cd court-search
          args=(chunk-input.xlsx output.xlsx)
          if [ "$PREPARE_ONLY" = "true" ]; then args+=(--prepare-only); fi
          python -u search.py "${args[@]}"

      - name: 중간 결과 파일 확정
        env:
          CHUNK_TAG: ${{ matrix.tag }}
          EXPECTED_COUNT: ${{ matrix.count }}
        run: |
          python - <<'PY'
          import os
          import openpyxl
          from pathlib import Path

          path = Path('court-search/output.xlsx')
          if not path.exists():
              raise SystemExit('❌ 중간 output.xlsx 없음')
          workbook = openpyxl.load_workbook(path, read_only=True, data_only=True)
          rows = list(workbook.active.iter_rows(values_only=True))
          expected = int(os.environ['EXPECTED_COUNT'])
          if len(rows) - 1 != expected:
              raise SystemExit(f'중간 결과 행 수 불일치: {len(rows) - 1}/{expected}')
          target = path.with_name(f"court-search-{os.environ['CHUNK_TAG']}.xlsx")
          path.replace(target)
          print(f'✅ 즉시 다운로드 파일 확정: {target} ({expected}건)')
          PY

      - name: 새 러너 재조회 대상 분리
        env:
          CHUNK_TAG: ${{ matrix.tag }}
        run: >-
          python court-search/chunk_workbook.py retry-input
          court-search/chunk-input.xlsx
          "court-search/court-search-$CHUNK_TAG.xlsx"
          "court-search/retry-input-$CHUNK_TAG.xlsx"
          "court-search/retry-count-$CHUNK_TAG.txt"

      - name: ${{ matrix.start }}-${{ matrix.end }}번 즉시 다운로드 공개
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-search-partial-${{ matrix.tag }}
          path: court-search/court-search-${{ matrix.tag }}.xlsx
          if-no-files-found: ignore
          retention-days: 7

      - name: 새 러너 재조회 요청 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-search-retry-input-${{ matrix.tag }}
          path: |
            court-search/retry-input-${{ matrix.tag }}.xlsx
            court-search/retry-count-${{ matrix.tag }}.txt
          if-no-files-found: error
          retention-days: 1

      - name: 통과 캡차 학습 후보 확정
        if: always()
        run: |
          mkdir -p court-search/captcha-success/images
          touch court-search/captcha-success/labels.jsonl
          echo "통과 확인 샘플: $(wc -l < court-search/captcha-success/labels.jsonl)건"

      - name: 통과 캡차 학습 후보 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captcha-learning-candidates-${{ matrix.tag }}
          path: court-search/captcha-success
          if-no-files-found: error
          retention-days: 7

  search_retry:
    name: 새 러너 재조회 ${{ matrix.start }}-${{ matrix.end }}
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, search]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: 재조회 요청 확인
        uses: actions/download-artifact@v4
        with:
          name: court-search-retry-input-${{ matrix.tag }}
          path: court-search/retry-request

      - name: 재조회 건수 확인
        id: retry_count
        env:
          CHUNK_TAG: ${{ matrix.tag }}
        run: |
          count=$(cat "court-search/retry-request/retry-count-$CHUNK_TAG.txt")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "새 실행환경 재조회 대상: $count건"

      - name: 기존 묶음 결과 받기
        uses: actions/download-artifact@v4
        with:
          name: court-search-partial-${{ matrix.tag }}
          path: court-search/retry-primary

      - name: 체크아웃
        if: ${{ steps.retry_count.outputs.count != '0' }}
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Python 설정
        if: ${{ steps.retry_count.outputs.count != '0' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: court-search/requirements.txt

      - name: 재조회 의존성 설치
        if: ${{ steps.retry_count.outputs.count != '0' }}
        run: |
          pip install -r court-search/requirements.txt
          playwright install chromium --with-deps

      - name: 누적 캡차 모델 불러오기
        if: ${{ steps.retry_count.outputs.count != '0' }}
        uses: actions/cache/restore@v4
        with:
          path: court-search/captcha-model
          key: court-captcha-v2-${{ github.run_id }}-retry
          restore-keys: |
            court-captcha-v2-

      - name: 실패 사건 새 실행환경 재조회
        if: ${{ steps.retry_count.outputs.count != '0' }}
        env:
          CHUNK_TAG: ${{ matrix.tag }}
          COURT_WORKERS: ${{ matrix.workers }}
          OCR_TORCH_THREADS: '2'
          CAPTCHA_DATA_DIR: captcha-retry-success
          CAPTCHA_SEED_DIR: captcha-model
          DEBUG_DIR: retry-debug
          DEBUG_TABLES: '1'
        run: >-
          python -u court-search/search.py
          "court-search/retry-request/retry-input-$CHUNK_TAG.xlsx"
          court-search/retry-output.xlsx

      - name: 최종 묶음 결과 확정
        if: always()
        env:
          CHUNK_TAG: ${{ matrix.tag }}
          RETRY_COUNT: ${{ steps.retry_count.outputs.count }}
        run: |
          mkdir -p court-search/final
          primary="court-search/retry-primary/court-search-$CHUNK_TAG.xlsx"
          final="court-search/final/court-search-$CHUNK_TAG.xlsx"
          if [ "$RETRY_COUNT" != "0" ] && [ -f court-search/retry-output.xlsx ]; then
            python court-search/chunk_workbook.py replace-retry \
              "$primary" court-search/retry-output.xlsx "$final"
          else
            cp "$primary" "$final"
          fi

      - name: 최종 묶음 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-search-final-${{ matrix.tag }}
          path: court-search/final/court-search-${{ matrix.tag }}.xlsx
          if-no-files-found: error
          retention-days: 7

      - name: 재조회 통과 캡차 후보 확정
        if: always()
        run: |
          mkdir -p court-search/captcha-retry-success/images
          touch court-search/captcha-retry-success/labels.jsonl
          echo "새 러너 통과 확인 샘플: $(wc -l < court-search/captcha-retry-success/labels.jsonl)건"

      - name: 재조회 통과 캡차 후보 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captcha-learning-retry-${{ matrix.tag }}
          path: court-search/captcha-retry-success
          if-no-files-found: error
          retention-days: 7

  combine:
    name: 전체 결과 병합
    if: always()
    needs: [prepare, search, search_retry]
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 병합 의존성 설치
        run: pip install openpyxl==3.1.5

      - name: 완료된 20건 파일 받기
        uses: actions/download-artifact@v4
        with:
          pattern: court-search-final-*
          path: court-search/chunk-results
          merge-multiple: true

      - name: 전체 결과 생성
        env:
          EXPECTED_TOTAL: ${{ needs.prepare.outputs.total }}
        run: |
          python court-search/chunk_workbook.py combine court-search/chunk-results court-search/output.xlsx
          python - <<'PY'
          import os
          import openpyxl
          workbook = openpyxl.load_workbook('court-search/output.xlsx', read_only=True, data_only=True)
          actual = workbook.active.max_row - 1
          expected = int(os.environ['EXPECTED_TOTAL'])
          if actual != expected:
              raise SystemExit(f'전체 결과 행 수 불일치: {actual}/{expected}')
          print(f'✅ 전체 결과 파일 생성: {actual}건')
          PY

      - name: 전체 결과 엑셀 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-search-result
          path: court-search/output.xlsx
          if-no-files-found: ignore
          retention-days: 7

      # 결과 파일을 먼저 확정한 뒤에만 통과 캡차를 정식 누적 모델로 승격한다.
      - name: 기존 누적 캡차 모델 복원
        uses: actions/cache/restore@v4
        with:
          path: court-search/captcha-model
          key: court-captcha-v2-${{ github.run_id }}
          restore-keys: |
            court-captcha-v2-

      - name: 이번 실행의 통과 캡차 후보 받기
        uses: actions/download-artifact@v4
        with:
          pattern: captcha-learning-*
          path: court-search/captcha-candidates

      - name: 기존 실행 학습자료 최초 이관
        if: ${{ inputs.captcha_seed_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_RUN_ID: ${{ inputs.captcha_seed_run_id }}
        run: |
          case "$SEED_RUN_ID" in
            *[!0-9]*|'') echo "올바르지 않은 seed run ID"; exit 1 ;;
          esac
          gh run download "$SEED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name court-search-result \
            --dir court-search/legacy-captcha

      - name: 공식 캡차 학습
        env:
          SEED_RUN_ID: ${{ inputs.captcha_seed_run_id }}
        run: |
          args=(
            --baseline court-search/captcha-model
            --candidate court-search/captcha-candidates
            --output court-search/captcha-model
          )
          if [ -n "$SEED_RUN_ID" ]; then
            args+=(--candidate court-search/legacy-captcha)
          fi
          python court-search/captcha_training.py "${args[@]}"
          cat court-search/captcha-model/training-report.json

      - name: 누적 캡차 모델 감사자료 보관
        if: ${{ inputs.prepare_only == false || inputs.captcha_seed_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: captcha-learning-model
          path: court-search/captcha-model
          if-no-files-found: error
          retention-days: 30

      - name: 다음 실행용 누적 캡차 모델 저장
        if: ${{ inputs.prepare_only == false || inputs.captcha_seed_run_id != '' }}
        uses: actions/cache/save@v4
        with:
          path: court-search/captcha-model
          key: court-captcha-v2-${{ github.run_id }}

      - name: 완료 요약
        if: always()
        run: |
          if [ -f court-search/output.xlsx ]; then
            ls -lh court-search/output.xlsx
          else
            echo "output.xlsx 없음 — 공개된 중간 결과를 확인하세요."
          fi
          if [ -f court-search/captcha-model/training-report.json ]; then
            echo "캡차 학습 결과:"
            cat court-search/captcha-model/training-report.json
          fi
