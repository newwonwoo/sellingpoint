name: 대법원 사건검색 자동조회

on:
  workflow_dispatch:
    inputs:
      input_sha:
        description: 'input.xlsx SHA (업로드 후 자동 입력)'
        required: false

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: court-search/requirements.txt

      - name: 의존성 설치
        run: |
          pip install --break-system-packages -r court-search/requirements.txt
          playwright install chromium --with-deps

      - name: input.xlsx 확인
        run: |
          if [ ! -f "court-search/input.xlsx" ]; then
            echo "❌ court-search/input.xlsx 없음"
            exit 1
          fi
          echo "✅ input.xlsx 확인"

      - name: 사건검색 실행
        run: |
          cd court-search
          python search.py input.xlsx output.xlsx

      - name: 결과 파일 생성 확인
        run: |
          python - <<'PY'
          import openpyxl
          from pathlib import Path
          path = Path("court-search/output.xlsx")
          if not path.exists():
              raise SystemExit("❌ output.xlsx 없음")
          wb = openpyxl.load_workbook(path, read_only=True, data_only=True)
          print(f"✅ 결과 파일 생성: {wb.active.max_row - 1}건")
          PY

      - name: 완료 요약
        if: always()
        run: |
          if [ -f "court-search/output.xlsx" ]; then
            ls -lh court-search/output.xlsx
          else
            echo "output.xlsx 없음"
          fi
