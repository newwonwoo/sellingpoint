name: 대법원 사건검색 자동조회

on:
  workflow_dispatch:
    inputs:
      input_sha:
        description: 'input.xlsx SHA (업로드 후 자동 입력)'
        required: false

permissions:
  contents: write

jobs:
  search:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 의존성 설치
        run: |
          pip install -r court-search/requirements.txt
          playwright install chromium
        shell: pwsh

      - name: input.xlsx 확인
        run: |
          if (-Not (Test-Path "court-search/input.xlsx")) {
            Write-Host "❌ court-search/input.xlsx 없음"
            exit 1
          }
          Write-Host "✅ input.xlsx 확인"
        shell: pwsh

      - name: 사건검색 실행
        run: |
          cd court-search
          python court_search.py input.xlsx output.xlsx
        shell: pwsh

      - name: 결과 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $DATE = (Get-Date).ToUniversalTime().AddHours(9).ToString("yyyyMMdd_HHmmss")
          Copy-Item "court-search/output.xlsx" "court-search/results/result_$DATE.xlsx"
          git add "court-search/results/"
          $diff = git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "자동조회 결과: $DATE"
          }
          git push
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 완료 요약
        if: always()
        run: |
          Write-Host "=== 실행 결과 ==="
          if (Test-Path "court-search/output.xlsx") {
            Get-Item "court-search/output.xlsx" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Host "output.xlsx 없음"
          }
          if (Test-Path "court-search/results/") {
            Get-ChildItem "court-search/results/" | Select-Object -Last 5 | Select-Object Name, Length
          }
        shell: pwsh
