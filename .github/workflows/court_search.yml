name: 대법원 사건검색 자동조회

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: '조회 입력 파일'
        type: choice
        options:
          - input.xlsx
          - test_input.xlsx
          - sample_input.xlsx
          - test_input_single.xlsx
          - test_input_user_cases.xlsx
        default: test_input.xlsx
        required: true
      prepare_only:
        description: '입력 점검만 실행 (검색 미제출)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: court-search/requirements.txt

      - name: 의존성 설치
        env:
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          if [ "$PREPARE_ONLY" = "true" ]; then
            pip install playwright==1.49.0 openpyxl==3.1.5 Pillow==11.0.0
          else
            pip install -r court-search/requirements.txt
          fi
          playwright install chromium --with-deps

      - name: 입력 파일 확인
        env:
          INPUT_FILE: ${{ inputs.input_file }}
        run: |
          case "$INPUT_FILE" in
            input.xlsx|test_input.xlsx|sample_input.xlsx|test_input_single.xlsx|test_input_user_cases.xlsx) ;;
            *) echo "허용되지 않은 입력 파일"; exit 1 ;;
          esac
          if [ ! -f "court-search/$INPUT_FILE" ]; then
            echo "❌ 입력 파일 없음: $INPUT_FILE"
            exit 1
          fi
          echo "✅ 입력 파일 확인: $INPUT_FILE"

      - name: 사건검색 실행
        env:
          INPUT_FILE: ${{ inputs.input_file }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          COURT_WORKERS: '3'
          OCR_TORCH_THREADS: '1'
          CAPTCHA_DATA_DIR: captcha-success
          DEBUG_DIR: debug
          DEBUG_TABLES: '1'
        run: |
          cd court-search
          args=("$INPUT_FILE" output.xlsx)
          if [ "$PREPARE_ONLY" = "true" ]; then args+=(--prepare-only); fi
          python -u search.py "${args[@]}"

      - name: 결과 파일 생성 확인
        env:
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          python - <<'PY'
          import os
          import openpyxl
          from pathlib import Path
          path = Path("court-search/output.xlsx")
          if not path.exists():
              raise SystemExit("❌ output.xlsx 없음")
          wb = openpyxl.load_workbook(path, read_only=True, data_only=True)
          rows = list(wb.active.iter_rows(values_only=True))
          if len(rows) < 2:
              raise SystemExit('결과가 비어 있습니다')
          if os.environ['PREPARE_ONLY'] == 'true':
              column = rows[0].index('사건명')
              failed = [row[:3] for row in rows[1:] if row[column] != '입력점검 완료']
              if failed:
                  raise SystemExit(f'입력점검 실패: {failed}')
          else:
              column = rows[0].index('사건명')
              failed = [row[:3] for row in rows[1:]
                        if not row[column] or str(row[column]).startswith('조회실패')]
              if failed:
                  # 일부 사건의 접속/캡차 실패와 관계없이 성공한 행과
                  # 실패 사유가 담긴 행을 함께 보관한다. 결과 파일 자체가
                  # 생성된 경우에는 사용자가 부분 결과를 내려받을 수 있어야 한다.
                  print(f'⚠ 일부 사건 조회 실패({len(failed)}건) — 결과 파일에 실패 사유를 포함해 보관합니다: {failed}')
          print(f"✅ 결과 파일 생성: {wb.active.max_row - 1}건")
          PY

      - name: 결과 엑셀 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-search-result
          path: |
            court-search/output.xlsx
            court-search/debug
            court-search/captcha-success
          if-no-files-found: ignore

      - name: 완료 요약
        if: always()
        run: |
          if [ -f "court-search/output.xlsx" ]; then
            ls -lh court-search/output.xlsx
          else
            echo "output.xlsx 없음"
          fi
          if [ -f "court-search/captcha-success/labels.jsonl" ]; then
            echo "통과 캡차 학습 샘플: $(wc -l < court-search/captcha-success/labels.jsonl)건"
          fi
