name: 대법원 사건검색 자동조회

on:
  workflow_dispatch:
    inputs:
      input_sha:
        description: 'input.xlsx SHA (업로드 후 자동 입력)'
        required: false

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: court-search/requirements.txt

      - name: 의존성 설치
        run: |
          pip install --break-system-packages -r court-search/requirements.txt
          playwright install chromium --with-deps

      - name: input.xlsx 확인
        run: |
          if [ ! -f "court-search/input.xlsx" ]; then
            echo "❌ court-search/input.xlsx 없음"
            exit 1
          fi
          echo "✅ input.xlsx 확인"

      - name: 사건검색 실행
        run: |
          cd court-search
          python court_search.py input.xlsx output.xlsx

      - name: 결과 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ='Asia/Seoul' date '+%Y%m%d_%H%M%S')
          cp court-search/output.xlsx "court-search/results/result_${DATE}.xlsx"
          git add "court-search/results/"
          if ! git diff --staged --quiet; then
            git commit -m "자동조회 결과: ${DATE}"
            git push
          else
            echo "변경사항 없음 — 커밋 생략"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 완료 요약
        if: always()
        run: |
          echo "=== 실행 결과 ==="
          if [ -f "court-search/output.xlsx" ]; then
            ls -lh court-search/output.xlsx
          else
            echo "output.xlsx 없음"
          fi
          echo "=== 최근 결과 파일 ==="
          ls -lht court-search/results/ 2>/dev/null | head -6 || echo "results/ 없음"
