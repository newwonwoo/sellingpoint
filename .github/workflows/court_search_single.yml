name: 대법원 단건 사건조회
run-name: 보호단건-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'One-time request identifier'
        type: string
        required: true
      expected_sha:
        description: 'Approved full execution commit SHA'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: court-single-40456047554-row121
  cancel-in-progress: false
jobs:
  single:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COURT_PYTHON: court-search/.runtime-venv/bin/python
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check approved execution and unchanged protected code
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          git fetch --no-tags --depth=1 origin d1fbbee0d2c0447871fd35a0a3379bc0183ff2b2
          git diff --exit-code d1fbbee0d2c0447871fd35a0a3379bc0183ff2b2 -- court-search
      - name: Restore runtime
        id: runtime
        uses: actions/cache/restore@v4
        with:
          path: |
            court-search/.runtime-venv
            court-search/.easyocr-model
          key: court-search-runtime-v3-cpu-ubuntu-24.04-${{ hashFiles('court-search/requirements.txt') }}
      - name: Prepare runtime if missing
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          python3 -m venv court-search/.runtime-venv
          "$COURT_PYTHON" -m pip install --upgrade pip
          "$COURT_PYTHON" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          "$COURT_PYTHON" -m pip install -r court-search/requirements.txt
      - name: Run exactly one protected input
        run: |
          test -x "$COURT_PYTHON"
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$COURT_PYTHON" .github/scripts/court_single_guarded.py run "$RUNNER_TEMP/court-single-40456047554-121"
      - name: Preserve one-row result and minimal provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-single-guarded-result
          path: |
            ${{ runner.temp }}/court-single-40456047554-121/public/result.xlsx
            ${{ runner.temp }}/court-single-40456047554-121/public/manifest.json
          if-no-files-found: error
          retention-days: 7
